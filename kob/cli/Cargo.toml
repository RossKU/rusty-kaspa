[package]
name = "kob-cli"
version = "0.1.0"
edition = "2021"

[lib]
name = "kob_cli"
path = "src/lib.rs"

[[bin]]
name = "kob-cli"
path = "src/main.rs"

[[bin]]
name = "kob-miner"
path = "src/bin/kob_miner.rs"

[[bin]]
name = "kob-e2e-util"
path = "src/bin/kob_e2e_util.rs"

# testnet-10 live E2E harness for the robust KCC-0020 stablecoin
# (STABLECOIN_ROBUST_DESIGN.md) -- builds/signs/submits the full DEPLOY(2-tx)
# -> MINT -> TRANSFER -> FREEZE -> SEIZE -> UNFREEZE -> BURN -> RAISE_CAP
# lifecycle against a live node. Not part of the product surface.
[[bin]]
name = "kob-stablecoin-e2e"
path = "src/bin/kob_stablecoin_e2e.rs"

# EXPERIMENTAL measurement bin (kob/BATCH_LIMITS.md) — deploys/settles
# large-N lab covenants on testnet only; not part of the product surface.
[[bin]]
name = "kob-batch-lab"
path = "src/bin/kob_batch_lab.rs"

[dependencies]
kob-core = { path = "../core" }
blake3 = { workspace = true }
kob-domain = { path = "../domain" }
kob-engine = { path = "../engine" }
kaspa-consensus-core = { workspace = true }
kaspa-pow = { workspace = true }
kaspa-rpc-core = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = { workspace = true }
url = "2"
clap = { workspace = true, features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
anyhow = "1"
k256 = { version = "0.13", features = ["schnorr"] }
rand = { workspace = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
tempfile = { workspace = true }

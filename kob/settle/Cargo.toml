[package]
name = "kob-settle"
version = "0.1.0"
edition = "2021"

[lib]
name = "kob_settle"
path = "src/lib.rs"

[dependencies]
# Crypto / wallet / mass / tx (from kob-core)
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
thiserror = "2"
k256 = { version = "0.13", default-features = false, features = ["schnorr", "alloc"] }
signature = "2"
zeroize = { workspace = true, features = ["derive"] }
chacha20poly1305 = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true }
blake2b_simd = { workspace = true }
kaspa-addresses = { workspace = true }
kaspa-consensus-core = { workspace = true }
kaspa-hashes = { workspace = true }

# RPC client / async chain plumbing (from kob-engine)
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = { workspace = true }
url = "2"
tracing = "0.1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
# Local (off-chain) covenant-script verification harness pattern, mirrored
# from kob-core for Phase 2's PaymentObserver unit tests.
kaspa-txscript = { workspace = true }
